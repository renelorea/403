<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Bot Taylor Swift</title>
  <link rel="stylesheet" href="estilos.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
  integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
</head>
<body class="torturedpoets">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="bio.html">Biografía</a>
        <a class="nav-link" href="ver.html">(Taylor's Version)</a>
        <a class="nav-link" href="chat.html">Chat bot</a>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4 d-flex flex-column align-items-center">

  <img src="taylor.jpg"  
       alt="Taylor Swift" class="chat-img mb-3" />

  <div class="chat-box p-3 rounded-4 shadow-sm w-100" id="chatBox">

    <div class="chat-message bot mb-3 p-2 rounded">¡Hola! Pregúntame algo sobre Taylor Swift.</div>

  </div>

  <form id="chatForm" class="w-100 mt-3 d-flex" autocomplete="off">
    <input type="text" id="userInput" class="form-control me-2" placeholder="Escribe tu pregunta..." required />
    <button type="submit" class="btn btn-primary px-4">Enviar</button>
  </form>

</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');

  const responses = {
    '¿cuándo nació taylor swift?': 'Taylor Swift nació el 13 de diciembre de 1989.',
    '¿de dónde es taylor swift?': 'Taylor Swift es de Reading, Pennsylvania, Estados Unidos.',
    '¿cuántos álbumes tiene taylor swift?': 'Taylor Swift tiene 10 álbumes de estudio hasta 2024.',
    '¿cuál es su álbum más reciente?': 'Su álbum más reciente es "Midnights", lanzado en 2022.',
    '¿qué género musical canta taylor swift?': 'Taylor Swift canta principalmente country, pop y pop rock.',
    '¿ha ganado premios?': 'Sí, Taylor ha ganado varios premios Grammy, American Music Awards y muchos más.',
    'hola': '¡Hola! ¿En qué puedo ayudarte sobre Taylor Swift?',
    'adiós': '¡Hasta luego! ¡Que tengas un buen día!',
    'gracias': '¡De nada! Estoy aquí para ayudarte.',
    '¿quién es taylor swift?': 'Taylor Swift es una cantante y compositora estadounidense conocida mundialmente.',
    '¿qué edad tiene taylor swift?': 'Taylor Swift tiene 34 años (nacida en 1989).',
    '¿cuáles son sus canciones más famosas?': 'Algunas de sus canciones más famosas son "Love Story", "You Belong With Me" y "Shake It Off".',
    '¿qué premios grammy tiene?': 'Taylor Swift ha ganado 12 premios Grammy hasta la fecha.',
    '¿cuándo empezó su carrera?': 'Taylor Swift comenzó su carrera en 2006 con su álbum debut homónimo.',
    '¿tiene pareja?': 'Taylor Swift suele mantener su vida privada reservada, pero actualmente no tiene pareja confirmada públicamente.',
    '¿qué idiomas habla?': 'Taylor Swift habla inglés y tiene nociones de otros idiomas, pero principalmente canta en inglés.',
    '¿qué álbum fue el primero?': 'Su primer álbum fue "Taylor Swift", lanzado en 2006.',
    '¿cuál es su estilo de moda?': 'Taylor tiene un estilo elegante y versátil que evoluciona con cada era musical.'
  };

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.classList.add('chat-message', sender, 'mb-3', 'p-2', 'rounded');
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const question = userInput.value.trim().toLowerCase();
    if(!question) return;

    addMessage(userInput.value, 'user');

    if (responses[question]) {
      setTimeout(() => addMessage(responses[question], 'bot'), 700);
    } else {
      setTimeout(() => addMessage('Lo siento, no sé la respuesta a esa pregunta.', 'bot'), 700);
    }

    userInput.value = '';
    userInput.focus();
  });
</script>

</body>
</html>
