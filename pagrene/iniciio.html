<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página Principal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #f6d365, #fda085);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .botones a {
      display: inline-block;
      margin: 10px;
      padding: 15px 30px;
      font-size: 16px;
      text-decoration: none;
      border-radius: 30px;
      color: white;
      background: linear-gradient(135deg, #667eea, #764ba2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .botones a:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Bienvenido</h1>
    <p>Elige una página para continuar:</p>
    <div class="botones">
      <a href="inicio.html">Ir a Página 1</a>
      <a href="index.html">Ir a Página 2</a>
    </div>
  </div>
</body>
</html>
