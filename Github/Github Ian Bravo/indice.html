<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 50px;
            color: #b0b0b0;
            font-weight: 300;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .menu-button {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: none;
            padding: 40px 30px;
            border-radius: 20px;
            color: white;
            font-size: 1.4em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .menu-button:hover::before {
            left: 100%;
        }

        .menu-button:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(255, 255, 255, 0.1);
        }

        .chatbot-btn {
            border-left: 4px solid #ff6b6b;
        }

        .chatbot-btn:hover {
            background: linear-gradient(145deg, #ff6b6b, #e74c3c);
            box-shadow: 0 20px 40px rgba(255, 107, 107, 0.3);
        }

        .proyecto-btn {
            border-left: 4px solid #4ecdc4;
        }

        .proyecto-btn:hover {
            background: linear-gradient(145deg, #4ecdc4, #26a69a);
            box-shadow: 0 20px 40px rgba(78, 205, 196, 0.3);
        }

        .juegos-btn {
            border-left: 4px solid #45b7d1;
        }

        .juegos-btn:hover {
            background: linear-gradient(145deg, #45b7d1, #3498db);
            box-shadow: 0 20px 40px rgba(69, 183, 209, 0.3);
        }

        .animacion-btn {
            border-left: 4px solid #96ceb4;
        }

        .animacion-btn:hover {
            background: linear-gradient(145deg, #96ceb4, #7fb069);
            box-shadow: 0 20px 40px rgba(150, 206, 180, 0.3);
        }

        .menu-button .icon {
            font-size: 2em;
            margin-bottom: 15px;
            display: block;
        }

        .footer {
            margin-top: 60px;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            h1 {
                font-size: 2.5em;
            }
            
            .menu-button {
                padding: 30px 20px;
                font-size: 1.2em;
            }
        }

        /* Efecto de partículas de fondo */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>
    
    <div class="container">
        <h1>Índice Principal</h1>
        <p class="subtitle">Selecciona una sección para explorar</p>
        
        <div class="menu-grid">
            <button class="menu-button chatbot-btn" onclick="navigateTo('bot.html')">
                <span class="icon">🤖</span>
                Chatbot
            </button>
            
            <button class="menu-button proyecto-btn" onclick="navigateTo('PROYECTO RENE\\index.HTML')">
                <span class="icon">📋</span>
                Proyecto
            </button>
            
            <button class="menu-button juegos-btn" onclick="navigateTo('juegos.html')">
                <span class="icon">🎮</span>
                Juegos
            </button>
            
            <button class="menu-button animacion-btn" onclick="navigateTo('F1.html')">
                <span class="icon">✨</span>
                Animación y Diseño
            </button>
        </div>
        
        <div class="footer">
            <p>Haz clic en cualquier botón para navegar a esa sección</p>
        </div>
    </div>

    <script>
        function navigateTo(page) {
            // Redirige a la página especificada
            window.location.href = page;
        }

        // Crear partículas de fondo
        function createParticles() {
            const bgAnimation = document.getElementById('bgAnimation');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                
                bgAnimation.appendChild(particle);
            }
        }

        // Inicializar partículas cuando se carga la página
        window.addEventListener('load', createParticles);
    </script>
</body>
</html>
